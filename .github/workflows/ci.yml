name: LandSure AI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite & Health Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit & Integration Tests
        env:
          LANDSURE_JWT_SECRET: ci_test_jwt_secret_with_more_than_thirty_two_characters_long_2026
        run: |
          pytest tests/test_stage1_core_services.py \
                 tests/test_stage2_document_and_gis.py \
                 tests/test_production_readiness.py \
                 tests/test_backend_configuration.py \
                 tests/test_model_loading.py \
                 tests/test_phase3a_document_and_copilot.py -v

  frontend-build:
    name: Frontend Typecheck & Build Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: TypeScript Check and Production Build
        run: npm run build
